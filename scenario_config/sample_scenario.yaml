# 4K Recording Scenario
# Sensor -> ISP_FE (OTF) -> ISP_BE (M2M) -> VENC (M2M)

scenario:
  name: "4K_Recording"
  
  tasks:
    # Sensor capture - 4K resolution
    - id: "t_sensor"
      hw: "Sensor_Ext"
      width: 3840
      height: 2160
      description: "4K sensor capture"

    # ISP Front-End processing
    - id: "t_isp_fe"
      hw: "ISP_FE"
      width: 3840
      height: 2160
      ip_mode: "default"  # Optional: power_saving, high_performance
      description: "ISP front-end (BPC, LSC)"

    # ISP Back-End processing with crop
    - id: "t_isp_be"
      hw: "ISP_BE"
      width: 3840
      height: 2160
      crop_width: 1920   # Crop to 1080p output
      crop_height: 1080
      ip_mode: "default"
      description: "ISP back-end (TNR, crop)"

    # Video encoding (receives cropped output)
    - id: "t_venc"
      hw: "VENC"
      width: 1920     # Uses cropped size from ISP_BE
      height: 1080
      ip_mode: "power_saving"  # Encode at lower power
      description: "H.264/HEVC encoding"

  edges:
    # Sensor to ISP_FE: Direct OTF connection (pipelined)
    - src: "t_sensor"
      dst: "t_isp_fe"
      type: "OTF"

    # ISP_FE to ISP_BE: Memory-to-Memory
    - src: "t_isp_fe"
      dst: "t_isp_be"
      type: "M2M"
      buffer_size: 33177600  # 4 bytes/pixel * 8.3MP

    # ISP_BE to VENC: Memory-to-Memory
    - src: "t_isp_be"
      dst: "t_venc"
      type: "M2M"
      buffer_size: 8294400   # 4 bytes/pixel * 2MP (cropped)
