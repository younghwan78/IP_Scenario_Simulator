hardware:
  # Sensor External Interface (excluded from SoC timing simulation)
  - name: "Sensor_Ext"
    type: "External"
    frame_width: 3840
    frame_height: 2160
    fps: 30.0
    sensor_mode: "4K_30fps"
    power_static: 10.0
    power_dynamic: 50.0

  # ISP Front-End with modules
  - name: "ISP_FE"
    type: "IP"
    clock: 600000000  # 600 MHz
    ppc: 4
    efficiency: 0.95
    power_static: 15.0
    power_dynamic: 80.0
    modules:
      - name: "BPC"
        type: "Generic"
        ppc: 4
      - name: "LSC"
        type: "Generic"
        ppc: 4
      - name: "Scaler0"
        type: "Scaler"
        scale_factor: [0.5, 0.5]

  # ISP Back-End
  - name: "ISP_BE"
    type: "IP"
    clock: 600000000
    ppc: 2
    efficiency: 0.90
    power_static: 12.0
    power_dynamic: 60.0
    modules:
      - name: "TNR"
        type: "Generic"
        ppc: 2
      - name: "Crop0"
        type: "Crop"
        crop_region: [0, 0, 1920, 1080]

  # Video Encoder
  - name: "VENC"
    type: "IP"
    clock: 400000000  # 400 MHz
    ppc: 1
    efficiency: 0.85
    power_static: 20.0
    power_dynamic: 100.0

  # DMA Controllers
  - name: "DMA_Read"
    type: "DMA"
    bandwidth: 25600000000  # 25.6 GB/s
    multiple_outstanding: 16
    burst_length: 256
    latency: 0.0000001  # 100ns

  - name: "DMA_Write"
    type: "DMA"
    bandwidth: 25600000000
    multiple_outstanding: 16
    burst_length: 256
    latency: 0.0000001

  # CPU Cluster
  - name: "CPU_Cluster"
    type: "Processor"
    clock: 2000000000  # 2.0 GHz
    cycles_per_op: 1.0
    num_cores: 8
    power_static: 50.0
    power_dynamic: 200.0

  # DRAM
  - name: "DRAM"
    type: "Memory"
    bandwidth: 51200000000  # 51.2 GB/s
    capacity: 8589934592  # 8 GB
    access_latency: 0.0000001  # 100ns
