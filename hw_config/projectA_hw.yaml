# Hardware Configuration (Static HW Capabilities)
# This file defines HW specs and constraints that remain constant per project.

# Sensor Module (SensorNode)
- name: "HP2"
  type: "Sensor"
  # Supported sensor modes (for validation)
  supported_sensor_modes:
  - "LN2"
  - "LN4"
  # frame_width, frame_height, fps, sensor_mode, v_valid_time -> scenario config

#########################
# Block CSIS
#########################
# CSIS_Wrapper
- name: "CSIS_LINK"
  type: "IP"
  ip_group: "CSIS"
  hierarchy_group: "ISP"
  min_size: [64, 64]
  max_size: [8192, 8192]
  supports_crop: false
  supports_scale: false
  supported_modes:
    - "Normal"
  modules:
    - name: "DC_PHY"
      type: "CIN"
      latency: 5 #cycles
    - name: "LINK"
      type: "COUT"
      latency: 5 #cycles
  edges:
    - src: "DC_PHY"
      dst: "LINK"
# CSIS
- name: "CSIS"
  type: "IP"
  ip_group: "CSIS"
  hierarchy_group: "ISP"
  min_size: [64, 64]
  max_size: [8192, 8192]
  supports_crop: true
  supports_scale: false
  supported_modes:
    - "Normal"
  modules:
    - name: "NFI_DEC"
      type: "CIN"
      latency: 5 #cycles
    - name: "DEGAMMA"
      type: "Generic"
      latency: 2 #cycles
    - name: "sMCB"
      type: "Generic"
      latency: 2 #cycles
    - name: "BNS"
      type: "Scaler"
      latency: 4 #cycles
    - name: "COUTFIFO"
      type: "COUT"
      latency: 3 #cycles
    - name: "CSIS_WDMA"
      type: "DMA"
      latency: 3 #cycles
      direction: "write"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
      supported_compressions:
        - "COMP_BAYER_LOSSLESS"
        - "COMP_BAYER_LOSSY"
      compression_ratios:
          COMP_BAYER_LOSSLESS: 1.0
          COMP_BAYER_LOSSY: 0.5
  edges:
    - src: "NFI_DEC"
      dst: "DEGAMMA"
    - src: "DEGAMMA"
      dst: "sMCB"
    - src: "sMCB"
      dst: "BNS"
    - src: "BNS"
      dst: "COUTFIFO"
    - src: "BNS"
      dst: "CSIS_WDMA"
#PDP
- name: "PDP"
  type: "IP"
  ip_group: "CSIS"
  hierarchy_group: "ISP"
  min_size: [64, 64]
  max_size: [8192, 8192]
  supports_crop: false
  supports_scale: false
  supported_modes:
    - "Normal"
  modules:
    - name: "REORDER"
      type: "CIN"
      latency: 4 #cycles
    - name: "BPC"
      type: "Generic"
      latency: 3 #cycles
    - name: "CROP"
      type: "Crop"
      latency: 3 #cycles
    - name: "ALC"
      type: "Generic"
      latency: 2 #cycles
    - name: "GAMMA"
      type: "Generic"
      latency: 5 #cycles
    - name: "PDSTAT"
      type: "Generic"
      latency: 5 #cycles
    - name: "STAT_WDMA"
      type: "DMA"
      latency: 3 #cycles
      direction: "write"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
    - name: "HPD_WDMA"
      type: "DMA"
      latency: 3 #cycles
      direction: "write"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
    - name: "VPD_WDMA"
      type: "DMA"
      latency: 3 #cycles
      direction: "write"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
  edges:
    - src: "REORDER"
      dst: "BPC"
    - src: "BPC"
      dst: "CROP"
    - src: "CROP"
      dst: "ALC"
    - src: "ALC"
      dst: "GAMMA"
    - src: "GAMMA"
      dst: "PDSTAT"
    - src: "PDSTAT"
      dst: "STAT_WDMA"
    - src: "PDSTAT"
      dst: "HPD_WDMA"
    - src: "PDSTAT"
      dst: "VPD_WDMA"
#PREP
- name: "PREP"
  type: "IP"
  ip_group: "CSIS"
  hierarchy_group: "ISP"
  min_size: [64, 64]
  max_size: [8192, 8192]
