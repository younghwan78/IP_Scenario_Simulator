# Video Encoder
- name: "MFC"
  type: "IP"
  ip_group: "MFC"
  hierarchy_group: "CODEC"
  min_size: [128, 128]
  max_size: [4096, 2160]
  supports_crop: false
  supports_scale: false
  supported_modes:
    - "default"
  modules:
    - name: "MFC_RDMA"
      type: "DMA"
      direction: "read"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
      supported_compressions:
        - "AFBC"
        - "Linear"
      compression_ratios:
        AFBC: 0.6
        Linear: 1.0
    - name: "COMPUTE"
      type: "Generic"
      latency: 8 #cycles
    - name: "MFC_WDMA"
      type: "DMA"
      latency: 3 #cycles
      direction: "write"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
      supported_compressions:
        - "SBWC_LOSSY"
      compression_ratios:
        SBWC_LOSSY: 0.5
  edges:
    - src: "MFC_RDMA"
      dst: "COMPUTE"
    - src: "COMPUTE"
      dst: "MFC_WDMA"

# Video Encoder
- name: "DPU"
  type: "IP"
  ip_group: "DPU"
  hierarchy_group: "DPU"
  min_size: [128, 128]
  max_size: [4096, 2160]
  supports_crop: false
  supports_scale: false
  supported_modes:
    - "default"
  modules:
    - name: "DPU_RDMA"
      type: "DMA"
      direction: "read"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
      supported_compressions:
        - "AFBC"
        - "SBWC_LOSSY"
      compression_ratios:
        AFBC: 0.6
        SBWC_LOSSY: 0.5
    - name: "COMPUTE"
      type: "Generic"
      latency: 8 #cycles
    - name: "COUTFIFO"
      type: "COUT"
      latency: 4 #cycles
  edges:
    - src: "DPU_RDMA"
      dst: "COMPUTE"
    - src: "COMPUTE"
      dst: "COUTFIFO"

# CPU Cluster
- name: "CPU_Cluster"
  type: "Processor"
  hierarchy_group: "CPU"
  clock: 2000000000  # 2.0 GHz (current clock, not max)
  cycles_per_op: 1.0
  num_cores: 8
  power_static: 50.0
  power_dynamic: 200.0

# DRAM
- name: "DRAM"
  type: "Memory"
  hierarchy_group: "MEMORY"
  bandwidth: 51200000000  # 51.2 GB/s
  capacity: 8589934592  # 8 GB
  access_latency: 0.0000001  # 100ns

