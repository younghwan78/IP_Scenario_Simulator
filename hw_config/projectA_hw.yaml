    - name: "CINFIFO"
      type: "CIN"
      latency: 4 #cycles
    - name: "PREP_RDMA"
      type: "DMA"
      latency: 3 #cycles
      direction: "read"
      max_bandwidth: 25600000000
      multiple_outstanding: 16
    - name: "DTP"
      type: "Generic"
      latency: 4 #cycles
    - name: "CROPIN"
      type: "Crop"
      latency: 4 #cycles
    - name: "BITMASK"
      type: "Generic"
      latency: 4 #cycles
    - name: "GAMMA_SESNOR"
      type: "Generic"
      latency: 4 #cycles
    - name: "BLCBYR"
      type: "Generic"
      latency: 4 #cycles
    - name: "COUTFIFO"
      type: "COUT"
      latency: 4 #cycles
  edges:
    - src: "CINFIFO"
      dst: "DTP"
    - src: "PREP_RDMA"
      dst: "DTP"
    - src: "DTP"
      dst: "CROPIN"
    - src: "CROPIN"
      dst: "BITMASK"
    - src: "BITMASK"
      dst: "GAMMA_SESNOR"
    - src: "GAMMA_SESNOR"
      dst: "BLCBYR"
    - src: "BLCBYR"
      dst: "COUTFIFO"

